background {
	color = rgb(000000)
}

input-field {
	size = 400, 70
	outline_thickness = 2
	rounding = 15
	outer_color = rgb(000000)
	inner_color = rgb(000000)
	font_color = rgb(ffffff)
	check_color = rgb(d79921)
	fail_color = rgb(cc241d)
	fade_on_empty = true
	placeholder_text =
	fail_text = 
	position = 0, 0
    display_characters = true
	display_character = *
}

label {
	text = cmd[update:1000]date +"%H:%M:%S"
	color = rgb(ffffff)
	font_size = 90
	font_family = Virgil 3 YOFF
	position = -40, 50
	halign = right
	valign = bottom
}

label {
	text = cmd[update:5000]cat /sys/class/power_supply/BAT1/capacity
	color = rgb(ffffff)
	font_size = 35
	font_family = Virgil 3 YOFF
	position = 0, 0
	halign = right
	valign = bottom
}
